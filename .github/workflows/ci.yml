# The green gate, on every push and PR. `npm run check` = format:check + lint + typecheck + test —
# the same single command the working agreement requires before every commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the gate; windows mirrors the primary dev machine (and proves the native
        # better-sqlite3 prebuild story on both). Node 22 (latest) + 24 LTS both ship node:sqlite,
        # so CI is the witness for the node-sqlite backend (the dev machine's 22.0.0 predates it).
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # The packaged form: npm ci already ran `prepare` (tsc → dist); prove the bin entry runs.
      - run: node dist/cli.js --version
      - run: node dist/cli.js help
      # The PUBLISHED form, without publishing: pack the tarball, install it globally into a
      # temp prefix, and drive the installed `chorus` through a real init → store → write →
      # read loop. This is what `npm i -g @bombadil/chorus` exercises on day one.
      - name: install-from-tarball smoke
        shell: bash
        env:
          CHORUS_HOME: ${{ runner.temp }}/chorus-smoke-home
        run: |
          # npm pack flattens the scoped name into the filename (@bombadil/chorus →
          # bombadil-chorus-<v>.tgz) — a shadow spelling a rename sweep for "@org/" will
          # miss, which is exactly how the org move broke this glob once. Ask npm for the
          # real filename instead of guessing it.
          TARBALL=$(npm pack --json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8'))[0].filename")
          PREFIX="${RUNNER_TEMP}/chorus-prefix"
          npm install -g "./$TARBALL" --prefix "$PREFIX"
          BIN="$PREFIX/bin/chorus"; [ -f "$BIN" ] || BIN="$PREFIX/chorus"
          "$BIN" --version
          "$BIN" init
          "$BIN" store create smoke
          "$BIN" remember user:ci editor vim --store smoke
          "$BIN" recall user:ci --store smoke | grep -q '"editor": "vim"'
          echo "tarball install smoke: OK"
